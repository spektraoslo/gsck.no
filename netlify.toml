# Netlify build config — used only for Deploy Previews of feature branches.
# Production deploys still go through GitHub Actions to GitHub Pages
# (see .github/workflows/deploy.yml).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 5 requires Node 20.3+ or 22+.
  NODE_VERSION = "22"
