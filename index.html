<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSCK – Grorud Spektra Cricket Klubb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --orange: #FF6500;
            --orange-dim: rgba(255, 101, 0, 0.12);
            --black: #080808;
        }

        html, body {
            height: 100%;
            background: var(--black);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* ── Diagonal stripe overlay (mirrors jersey design) ── */
        .stripes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .stripe {
            position: absolute;
            left: -60%;
            width: 220%;
            transform: rotate(-35deg);
            transform-origin: left center;
        }
        .s1 { top: 12%;  height: 70px;  background: linear-gradient(90deg, transparent 0%, rgba(255,101,0,.13) 50%, transparent 100%); }
        .s2 { top: 20%;  height: 28px;  background: linear-gradient(90deg, transparent 0%, rgba(255,101,0,.07) 50%, transparent 100%); }
        .s3 { top: 58%;  height: 90px;  background: linear-gradient(90deg, transparent 0%, rgba(255,101,0,.11) 50%, transparent 100%); }
        .s4 { top: 70%;  height: 22px;  background: linear-gradient(90deg, transparent 0%, rgba(255,101,0,.06) 50%, transparent 100%); }

        /* ── Ambient glow ── */
        .glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,101,0,.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: breathe 5s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { opacity: .6; }
            50%       { opacity: 1;  }
        }

        /* ── Corner frame ── */
        .corner {
            position: fixed;
            width: 64px; height: 64px;
            border: 1.5px solid rgba(255,101,0,.25);
            pointer-events: none; z-index: 1;
        }
        .c-tl { top: 20px; left: 20px;  border-right: none; border-bottom: none; }
        .c-tr { top: 20px; right: 20px; border-left:  none; border-bottom: none; }
        .c-bl { bottom: 20px; left: 20px;  border-right: none; border-top: none; }
        .c-br { bottom: 20px; right: 20px; border-left:  none; border-top: none; }

        /* ── Layout ── */
        .page {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            padding: 2rem;
            text-align: center;
        }

        /* ── Badge logo ── */
        .badge-wrap {
            width: 180px; height: 180px;
            margin-bottom: 2.2rem;
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0 0 32px rgba(255,101,0,.5));
        }
        .badge-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0);    }
            50%       { transform: translateY(-10px); }
        }

        /* ── WIP pill ── */
        .wip {
            display: inline-flex;
            align-items: center;
            gap: .55rem;
            border: 1px solid rgba(255,101,0,.35);
            background: rgba(255,101,0,.08);
            border-radius: 100px;
            padding: .45rem 1.2rem;
            font-size: .75rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--orange);
            margin-bottom: 1.6rem;
        }
        .pip {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--orange);
            animation: blink 1.3s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1;   }
            50%       { opacity: .15; }
        }

        /* ── Heading ── */
        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.8rem, 9vw, 5.5rem);
            line-height: .95;
            letter-spacing: .04em;
            margin-bottom: .4rem;
        }
        h1 em { color: var(--orange); font-style: normal; }

        .tagline {
            font-size: clamp(.75rem, 2vw, .9rem);
            letter-spacing: .3em;
            text-transform: uppercase;
            color: rgba(255,255,255,.35);
            margin-bottom: 2.2rem;
        }

        /* ── Rule ── */
        hr {
            border: none;
            height: 1px;
            width: 56px;
            background: linear-gradient(90deg, transparent, var(--orange), transparent);
            margin-bottom: 1.8rem;
        }

        /* ── Body text ── */
        .body {
            color: rgba(255,255,255,.42);
            font-size: .95rem;
            line-height: 1.75;
            max-width: 420px;
            margin-bottom: 2.2rem;
        }

        .contact {
            font-size: .78rem;
            color: rgba(255,255,255,.28);
            letter-spacing: .05em;
        }
        .contact a {
            color: var(--orange);
            text-decoration: none;
            transition: opacity .2s;
        }
        .contact a:hover { opacity: .65; }
    </style>
</head>
<body>

    <!-- Background stripes -->
    <div class="stripes">
        <div class="stripe s1"></div>
        <div class="stripe s2"></div>
        <div class="stripe s3"></div>
        <div class="stripe s4"></div>
    </div>
    <div class="glow"></div>

    <!-- Corner frame -->
    <div class="corner c-tl"></div>
    <div class="corner c-tr"></div>
    <div class="corner c-bl"></div>
    <div class="corner c-br"></div>

    <main class="page">

        <!-- Badge -->
        <div class="badge-wrap">
            <img src="gsck-logo.png" alt="Grorud Spektra Cricket Klubb logo">
        </div>

        <!-- Status pill -->
        <div class="wip"><span class="pip"></span>Work in Progress</div>

        <!-- Heading -->
        <h1>GRORUD SPEKTRA<br><em>CRICKET KLUBB</em></h1>
        <p class="tagline">Oslo, Norway &nbsp;·&nbsp; Est. 2026</p>

        <hr>

        <p class="body">
            Our new website is currently under construction.<br>
            Something great is coming — stay tuned.
        </p>

        <p class="contact">
            Contact us at <a href="mailto:info@gsck.no">info@gsck.no</a>
        </p>

    </main>

</body>
</html>
